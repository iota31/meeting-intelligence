[pytest]
minversion = 8.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for contract/integration scope
markers =
    contract: API contract and integration tests (black-box over HTTP)
    audio: Audio upload/transcription contract tests
    slow: Tests that may take longer (e.g., extraction, chat, audio processing)

# Reasonable defaults for live HTTP tests
addopts = -v --strict-markers --tb=short
timeout = 300

# Do not collect from backend/ or frontend/ source trees
norecursedirs = backend frontend .venv venv .git node_modules data

# Environment variable for base URL (override via env)
# Default is http://127.0.0.1:8000 in test code
